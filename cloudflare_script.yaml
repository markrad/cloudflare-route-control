set_cloudflare_route:
  sequence:
  - action: shell_command.modify_route
    metadata: {}
    data:
      state: '{{ state }}'
      host: '{{ host }}'
      service: '{{ service }}'
    response_variable: script_output
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ script_output.returncode == 0 }}

          '
      sequence:
      - action: system_log.write
        data:
          logger: script.set_cloudflare_route
          level: info
          message: 'Successfully set route {{ host }} to {{ state }}

            '
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ state == ''on'' }}'
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: '{{ entity_id }}'
        default:
        - action: input_boolean.turn_off
          target:
            entity_id: '{{ entity_id }}'
    default:
    - action: system_log.write
      data:
        logger: script.set_cloudflare_route
        level: warning
        message: 'Failed to set route {{ host }} to {{ state }} - Return code: {{
          script_output.returncode }}; msg: {{ script_output.stderr }}

          '
  alias: Set Cloudflare Route
  description: ''
  fields:
    host:
      selector:
        text:
      name: host
      required: true
    state:
      selector:
        text:
      name: state
      required: true
    service:
      selector:
        text:
      name: service
      required: true
    entity_id:
      selector:
        entity: {}
      name: entity_id
      required: true
  mode: queued
  max: 10